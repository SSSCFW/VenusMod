 'OspfCommandTest', 'OspfEngineTest', 'OspfIntegrationTest', 'OspfPresenceTest', 'NatIntegrationTest', 'NatTableTest', 'NatServiceTest', 'NatRoutingTest', 'NatLimitsTest', 'VrrpEngineTest', 'VrrpIntegrationTest', 'VrrpBoundaryTest', 'VrrpCodecTest', 'StpContractTest', 'StpEngineTest', 'StpIntegrationTest', 'StpBoundaryTest', 'TopologyIsolationTest', 'NetworkGogglesReadoutTest', 'CableTopologyTest', 'CableTopologyFuzzTest', 'CableTopologyScaleTest', 'BgpContractTest', 'BgpIntegrationTest', 'BgpEngineTest', 'BgpBoundaryTest', 'BgpCodecTest', 'BgpLimitsTest', 'BgpCompatibilityTest', 'DnsContractTest', 'DnsBehaviorTest', 'DnsNetworkTest', 'DnsLimitsTest', 'DnsCodecTest', 'DnsGuideTest'].each { checkClassName ->
    def verification = tasks.register('verify' + checkClassName.replace('Test', ''), JavaExec) {
        dependsOn compileNetworkTests
