tasks.register('verifyMachineRendering') {
    description = 'Reject unsafe machine inheritance, cullfaces and out-of-block geometry.'
    group = 'verification'
    // プロジェクト参照を持つためconfiguration cacheの対象外にする。
    notCompatibleWithConfigurationCache('Validation inspects project source/model files')
    doLast {
        def sources = fileTree('src/main/java/dev/ssscfw/venusmod') { include '**/*.java' }
        def unsafe = sources.findAll { it.name != 'VenusMachineBlock.java' && it.text =~ /extends\s+(?:[\w.]+\.)?KineticBlock\b/ }
        if (!unsafe.empty) throw new GradleException("Machines must extend VenusMachineBlock: ${unsafe}")
        def slurper = new JsonSlurper()
        def root = file('src/main/resources')
        def tags = slurper.parse(new File(root, 'data/venusmod/tags/block/machines.json'))
        def resolve
        resolve = { String name, Set seen ->
            if (!seen.add(name)) throw new GradleException("Cyclic model parent: ${name}")
            def parts = name.split(':', 2)
            def model = slurper.parse(new File(root, "assets/${parts[0]}/models/${parts[1]}.json"))
            if (model.elements != null) return model.elements
            if (model.parent?.startsWith('venusmod:')) return resolve(model.parent, seen)
            throw new GradleException("Machine ${name} has no verifiable geometry")
        }
        int checked = 0
        tags.values.each { entry ->
            def id = entry instanceof Map ? entry.id : entry
            def elements = resolve(id.replace(':', ':block/'), new HashSet())
            elements.each { element ->
                if (element.rotation) throw new GradleException("Rotated machine geometry requires a new bounds regression test: ${id}")
                for (int axis = 0; axis < 3; axis++) {
                    if (!(0 <= element.from[axis] && element.from[axis] < element.to[axis] && element.to[axis] <= 16))
                        throw new GradleException("Machine geometry must stay inside [0,16]: ${id} ${element}")
                }
                element.faces.each { face, data ->
                    if (data.cullface != null) throw new GradleException("Do not cull partial machine faces: ${id}/${face}")
                }
                checked++
            }
        }
        println "Verified ${tags.values.size()} machine models, ${checked} cuboids, safe machine inheritance."
    }
}
tasks.named('check') { dependsOn 'verifyMachineRendering' }

// 金星刀鍛錬機が旧「手持ち右クリック強化」へ戻らず、NeoForgeの公開画面登録イベントを使う契約を固定する。
tasks.register('verifyVenusBladeForgeGui') {
    description = 'Verify Venus Blade Forge keeps its GUI, internal blade slot and event-based screen registration.'
    group = 'verification'
    notCompatibleWithConfigurationCache('Validation inspects project source files')
    doLast {
        def block = file('src/main/java/dev/ssscfw/venusmod/compat/create/VenusBladeForgeBlock.java')
        def blockEntity = file('src/main/java/dev/ssscfw/venusmod/compat/create/VenusBladeForgeBlockEntity.java')
        def menu = file('src/main/java/dev/ssscfw/venusmod/compat/create/VenusBladeForgeMenu.java')
        def screen = file('src/main/java/dev/ssscfw/venusmod/compat/create/client/VenusBladeForgeScreen.java')
        def compat = file('src/main/java/dev/ssscfw/venusmod/compat/create/VenusCreateCompat.java')
        def client = file('src/main/java/dev/ssscfw/venusmod/compat/create/client/VenusCreateClientCompat.java')
        def phase2Client = file('src/main/java/dev/ssscfw/venusmod/client/VenusPhase2Client.java')

        [block, blockEntity, menu, screen, compat, client, phase2Client].each {
            if (!it.isFile()) throw new GradleException("Missing Venus Blade Forge GUI source: ${it}")
        }
        if (!block.text.contains('player.openMenu(forge)'))
            throw new GradleException('Venus Blade Forge must open its menu on right click.')
        if (block.text.contains('cycleSelection(') || block.text.contains('tryUpgrade(serverPlayer, held'))
            throw new GradleException('Legacy direct right-click forge controls must not return.')
        if (!blockEntity.text.contains('new ItemStackHandler(1)'))
            throw new GradleException('Venus Blade Forge must persist one internal blade slot.')
        if (!blockEntity.text.contains('ItemHelper.dropContents(level, worldPosition, bladeInv)'))
            throw new GradleException('Stored blade must drop when the forge is destroyed.')
        if (!menu.text.contains('BUTTON_UPGRADE') || !menu.text.contains('SlotItemHandler'))
            throw new GradleException('Forge menu must expose blade slot and upgrade controls.')
        if (!screen.text.contains('AbstractContainerScreen<VenusBladeForgeMenu>'))
            throw new GradleException('Forge screen is not wired to its menu.')
        if (!compat.text.contains('VENUS_BLADE_FORGE_MENU') || !compat.text.contains('MENU_TYPES.register(modBus)'))
            throw new GradleException('Create compat must register the forge menu type.')
        if (client.text.contains('MenuScreens.register'))
            throw new GradleException('MenuScreens.register is private in 1.21.1; use RegisterMenuScreensEvent instead.')
        if (!client.text.contains('RegisterMenuScreensEvent') || !client.text.contains('event.register(')
                || !client.text.contains('VenusBladeForgeScreen::new'))
            throw new GradleException('Client compat must register the forge screen through RegisterMenuScreensEvent.')
        if (!phase2Client.text.contains('registerScreens(RegisterMenuScreensEvent event)')
                || !phase2Client.text.contains('VenusCreateClientCompat.registerScreens(event)'))
            throw new GradleException('Client mod-bus event must forward RegisterMenuScreensEvent to Create compat.')

        println 'Verified Venus Blade Forge GUI contract.'
    }
}
tasks.named('check') { dependsOn 'verifyVenusBladeForgeGui' }

