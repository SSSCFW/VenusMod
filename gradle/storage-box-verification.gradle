def compileStorageBoxChecks = tasks.register('compileStorageBoxChecks', JavaCompile) {
    source = files(
            'src/main/java/dev/ssscfw/venusmod/storagebox/StorageBoxRules.java',
            'tools/tests/StorageBoxRulesChecks.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/storageBoxChecks')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.register('verifyStorageBoxRules', JavaExec) {
    group = 'verification'
    dependsOn compileStorageBoxChecks
    classpath compileStorageBoxChecks.flatMap { it.destinationDirectory }
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    mainClass = 'StorageBoxRulesChecks'
}
tasks.named('check') { dependsOn 'verifyStorageBoxRules' }

tasks.register('verifyStorageBoxCoreWiring') {
    group = 'verification'
    notCompatibleWithConfigurationCache('Validation inspects project source files')
    doLast {
        def root = 'src/main/java/dev/ssscfw/venusmod/'
        def components = file(root + 'registry/ModDataComponents.java').text
        def data = file(root + 'storagebox/StorageBoxData.java').text
        def mod = file(root + 'VenusMod.java').text
        if (!components.contains('ItemStack.SINGLE_ITEM_CODEC')
                || !components.contains('ItemStack.STREAM_CODEC')
                || !components.contains('ExtraCodecs.NON_NEGATIVE_INT')
                || !components.contains('ByteBufCodecs.VAR_INT'))
            throw new GradleException('Storage Box components must persist and network-sync template/count.')
        if (!data.contains('ItemStack.isSameItemSameComponents')
                || !data.contains('StorageBoxRules.accepted(')
                || !data.contains('StorageBoxRules.extractable(')
                || !data.contains('storage_box_blacklist'))
            throw new GradleException('Storage Box mutations must use shared rules, full components and blacklist.')
        if (!mod.contains('ModDataComponents.register(modBus)'))
            throw new GradleException('Storage Box Data Components must register before item use.')
        println 'Verified Storage Box core wiring.'
    }
}
tasks.named('check') { dependsOn 'verifyStorageBoxCoreWiring' }

tasks.register('verifyStorageBoxItemGuiWiring') {
    group = 'verification'
    notCompatibleWithConfigurationCache('Validation inspects project source files')
    doLast {
        def root = 'src/main/java/dev/ssscfw/venusmod/'
        def items = file(root + 'registry/ModItems.java').text
        def menus = file(root + 'registry/ModMenus.java').text
        def item = file(root + 'storagebox/StorageBoxItem.java').text
        def menu = file(root + 'storagebox/StorageBoxMenu.java').text
        def client = file(root + 'client/StorageBoxClient.java').text
        def screen = file(root + 'client/StorageBoxScreen.java').text
        def recipe = new groovy.json.JsonSlurper().parse(file('src/main/resources/data/venusmod/recipe/storage_box.json'))
        def blacklist = new groovy.json.JsonSlurper().parse(file('src/main/resources/data/venusmod/tags/item/storage_box_blacklist.json'))
        if (!items.contains('ITEMS.register("storage_box"') || !menus.contains('MENUS.register("storage_box"'))
            throw new GradleException('Storage Box item/menu must be registered.')
        if (!item.contains('new StorageBoxMenu(') || !menu.contains('StorageBoxData.insert(')
                || !menu.contains('StorageBoxData.extract(') || !screen.contains('BUTTON_AUTO_COLLECT')
                || !client.contains('event.register(ModMenus.STORAGE_BOX.get(), StorageBoxScreen::new)'))
            throw new GradleException('Storage Box GUI must use the shared data API.')
        if (recipe.result.id != 'venusmod:storage_box' || !blacklist.values.contains('venusmod:storage_box'))
            throw new GradleException('Storage Box recipe/blacklist resources are missing.')
        println 'Verified Storage Box item and GUI wiring.'
    }
}
tasks.named('check') { dependsOn 'verifyStorageBoxItemGuiWiring' }

tasks.register('verifyStorageBoxActionWiring') {
    group = 'verification'
    notCompatibleWithConfigurationCache('Validation inspects project source files')
    doLast {
        def root = 'src/main/java/dev/ssscfw/venusmod/'
        def net = file(root + 'storagebox/StorageBoxNetwork.java').text
        def actions = file(root + 'storagebox/StorageBoxActions.java').text
        def events = file(root + 'storagebox/StorageBoxEvents.java').text
        def use = file(root + 'storagebox/StorageBoxUseHandler.java').text
        def item = file(root + 'storagebox/StorageBoxItem.java').text
        def client = file(root + 'client/StorageBoxClient.java').text
        def mod = file(root + 'VenusMod.java').text
        if (!net.contains('player.getMainHandItem().getItem() instanceof StorageBoxItem')
                || !net.contains('INSERT_ALL') || !net.contains('EXTRACT_STACK')
                || !net.contains('DROP_STACK') || !net.contains('TOGGLE_AUTO_COLLECT'))
            throw new GradleException('Storage Box C2S actions must revalidate main hand and expose four actions.')
        if (!client.contains('GLFW.GLFW_KEY_APOSTROPHE') || !client.contains('Screen.hasShiftDown()')
                || !client.contains('Screen.hasControlDown()') || !client.contains('PacketDistributor.sendToServer'))
            throw new GradleException('Storage Box apostrophe modifier controls are not wired.')
        if (!events.contains('StorageBoxData.template(box).isEmpty()')
                || !events.contains('StorageBoxData.autoCollect(box)'))
            throw new GradleException('Auto collect must skip empty boxes and require ON.')
        if (!actions.contains('Capabilities.ItemHandler.BLOCK') || !actions.contains('handler.insertItem('))
            throw new GradleException('Block inventory dumping must use NeoForge item capability.')
        if (!use.contains('copyWithCount(1)') || !use.contains('ItemStack.isSameItemSameComponents')
                || !item.contains('finishUsingItem('))
            throw new GradleException('Stored item direct use must reconcile one virtual item and byproducts.')
        if (!mod.contains('StorageBoxNetwork.register(modBus)')
                || !mod.contains('StorageBoxEvents::onItemPickup'))
            throw new GradleException('Storage Box networking/events must be registered.')
        println 'Verified Storage Box action wiring.'
    }
}
tasks.named('check') { dependsOn 'verifyStorageBoxActionWiring' }

tasks.register('verifyStorageBoxVisualAndGameTests') {
    group = 'verification'
    notCompatibleWithConfigurationCache('Validation inspects project source files')
    doLast {
        def root = 'src/main/java/dev/ssscfw/venusmod/'
        def decorator = file(root + 'client/StorageBoxItemDecorator.java').text
        def client = file(root + 'client/StorageBoxClient.java').text
        def tests = file(root + 'test/StorageBoxGameTests.java').text
        def item = file(root + 'storagebox/StorageBoxItem.java').text
        if (!client.contains('RegisterItemDecorationsEvent')
                || !client.contains('new StorageBoxItemDecorator()')
                || !decorator.contains('graphics.renderItem(template')
                || !decorator.contains('StorageBoxData.storedCount(box)'))
            throw new GradleException('Storage Box non-empty item decoration is not wired.')
        if (!item.contains('return StorageBoxData.storedCount(stack) > 0'))
            throw new GradleException('Non-empty Storage Box must use foil/glint.')
        if (!tests.contains('ItemStack.isSameItemSameComponents')
                || !tests.contains('Integer.MAX_VALUE - 1')
                || !tests.contains('StorageBoxData.template(box).isEmpty()'))
            throw new GradleException('Storage Box GameTests must cover components, capacity and empty policy.')
        println 'Verified Storage Box visuals and GameTest coverage wiring.'
    }
}
tasks.named('check') { dependsOn 'verifyStorageBoxVisualAndGameTests' }
