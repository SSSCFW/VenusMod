// Minecraft非依存の実ルール検査。既存検査を残したまま新しい効果/保護/配送検査を加える。
def compileTreasureChecks = tasks.register('compileKingsTreasureChecks', JavaCompile) {
    source = files(
            'src/main/java/dev/ssscfw/venusmod/treasure/TreasureRules.java',
            'src/main/java/dev/ssscfw/venusmod/treasure/RoyalBladeDamageRules.java',
            'src/main/java/dev/ssscfw/venusmod/treasure/RoyalBladeEffectsRules.java',
            'src/main/java/dev/ssscfw/venusmod/treasury/TreasuryBladeRules.java',
            'src/main/java/dev/ssscfw/venusmod/treasury/GiveCaptureRules.java',
            'src/main/java/dev/ssscfw/venusmod/treasury/GiveDeliveryRules.java',
            'src/main/java/dev/ssscfw/venusmod/treasury/VolleyPriority.java',
            'src/main/java/dev/ssscfw/venusmod/treasury/TreasuryVolleyRules.java',
            'src/main/java/dev/ssscfw/venusmod/upgrade/ForgeScreenLayout.java',
            'tools/tests/TreasureRulesChecks.java',
            'tools/tests/TreasureRulesLimitChecks.java',
            'tools/tests/RoyalBladeDamageRulesChecks.java',
            'tools/tests/RoyalBladeEffectsRulesChecks.java',
            'tools/tests/TreasuryBladeRulesChecks.java',
            'tools/tests/TreasuryVolleyRulesChecks.java',
            'tools/tests/GiveCaptureRulesChecks.java',
            'tools/tests/GiveDeliveryRulesChecks.java',
            'tools/tests/ForgeScreenLayoutChecks.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/kingsTreasureChecks')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.encoding = 'UTF-8'
    options.release = 21
}
[
    verifyKingsTreasureRules: 'TreasureRulesChecks',
    verifyKingsTreasureLimits: 'TreasureRulesLimitChecks',
    verifyRoyalBladeDamageRules: 'RoyalBladeDamageRulesChecks',
    verifyRoyalBladeEffectsRules: 'RoyalBladeEffectsRulesChecks',
    verifyTreasuryBladeRules: 'TreasuryBladeRulesChecks',
    verifyTreasuryVolleySelection: 'TreasuryVolleyRulesChecks',
    verifyTreasuryGiveCapture: 'GiveCaptureRulesChecks',
    verifyTreasuryGiveDelivery: 'GiveDeliveryRulesChecks',
    verifyForgeScreenLayout: 'ForgeScreenLayoutChecks'
].each { taskName, checkClass ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        dependsOn compileTreasureChecks
        classpath compileTreasureChecks.flatMap { it.destinationDirectory }
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        mainClass = checkClass
    }
    tasks.named('check') { dependsOn taskName }
}

tasks.register('verifyKingsTreasureRenderDirection') {
    group = 'verification'
    notCompatibleWithConfigurationCache('Validation inspects project source files')
    doLast {
        def entity = file('src/main/java/dev/ssscfw/venusmod/treasure/RoyalBladeEntity.java').text
        def renderer = file('src/main/java/dev/ssscfw/venusmod/client/RoyalBladeRenderer.java').text
        if (!entity.contains('EntityDataSerializers.VECTOR3') || !entity.contains('public Vec3 aimDirection()')
                || !entity.contains('setAimDirection(direction);') || !renderer.contains('blade.aimDirection()'))
            throw new GradleException('Royal blades must sync and render the real aim direction.')
        if (!(renderer =~ /rotationTo\s*\(\s*MODEL_TIP\s*,\s*target\s*\)/)
                || renderer.contains('blade.getYRot()') || renderer.contains('blade.getXRot()'))
            throw new GradleException('Render the OBJ tip from its vector, not reconstructed yaw/pitch.')
        if (!renderer.contains('Axis.XP.rotationDegrees(age * 1.5F)')
                || !(renderer =~ /addVertex\s*\(\s*matrix\s*,\s*-0\.15F\s*,/))
            throw new GradleException('Royal blade rings must be perpendicular to the blade axis.')
        println 'Verified royal blade direction contract.'
    }
}
tasks.named('check') { dependsOn 'verifyKingsTreasureRenderDirection' }

tasks.register('verifyKingsTreasureInteractionContracts') {
    group = 'verification'
    notCompatibleWithConfigurationCache('Validation inspects project source files')
    doLast {
        def root = 'src/main/java/dev/ssscfw/venusmod/'
        def treasure = file(root + 'treasure/KingsTreasure.java').text
        def entity = file(root + 'treasure/RoyalBladeEntity.java').text
        def effects = file(root + 'treasure/RoyalBladeEffects.java').text
        def bridge = file(root + 'compat/SlashBladeTreasuryCompat.java').text
        def upgrades = file(root + 'event/BladeUpgradeEvents.java').text
        def client = file(root + 'client/KingsTreasureClient.java').text
        def events = file(root + 'event/KingsTreasuryEvents.java').text
        def mod = file(root + 'VenusMod.java').text
        def ja = new groovy.json.JsonSlurper().parse(file('src/main/resources/assets/venusmod/lang/ja_jp.json'))
        def en = new groovy.json.JsonSlurper().parse(file('src/main/resources/assets/venusmod/lang/en_us.json'))
        if (treasure.contains('addCooldown(') || treasure.contains('isOnCooldown('))
            throw new GradleException('King treasure must not use item cooldowns.')
        if (!client.contains('keySwapOffhand.consumeClick()') || !client.contains('keyShift.isDown()'))
            throw new GradleException('F/Shift+F controls must consume swap-offhand input.')
        if (!events.contains('onCommand(CommandEvent') || !events.contains('context.withCommand(new CapturingGive(')
                || !events.contains('context = context.getChild()') || !events.contains('GiveDeliveryRules.deliver('))
            throw new GradleException('Give capture must wrap executed give commands, including execute children.')
        if (events.contains('PENDING_GIVES') || events.contains('countMatching(') || events.contains('getContainerSize()'))
            throw new GradleException('Give capture must not absorb existing inventory or use delayed component comparisons.')
        if (!events.contains('autoCollect(player.getUUID())') || !events.contains('KingTreasuryItem.hasTreasury(player)')
                || !mod.contains('KingsTreasuryEvents::onCommand') || !mod.contains('KingsTreasuryEvents::onItemPickup'))
            throw new GradleException('Give/pickup collection must be registered and require ON plus treasury ownership.')
        int tickStart = treasure.indexOf('private static void tick(PlayerTickEvent.Post')
        int tickEnd = treasure.indexOf('private static void cancel(UUID owner)', tickStart)
        if (tickStart < 0 || tickEnd < 0 || !treasure.contains('TreasureRules.keepPrepared(')
                || treasure.substring(tickStart, tickEnd).contains('!isHeld(player)'))
            throw new GradleException('Switching items must not cancel prepared blades.')
        if (!treasure.contains('.clientTrackingRange(32)') || !entity.contains('sendParticles(viewer, particle, true')
                || !entity.contains('FAR_PARTICLE_RANGE_SQR'))
            throw new GradleException('Long-range particles and entity tracking must remain.')
        if (!entity.contains('RoyalBladeEffectsRules.returnsBlade(phantasm(), impacted)')
                || !entity.contains('KingsTreasure.returnSpentBlade(player, blade())')
                || !treasure.contains('RoyalBladeEffects.returnBlade(player.serverLevel(), original)')
                || !treasure.contains('storage.insert(player.getUUID(), returned, 1)'))
            throw new GradleException('Normal completions must return blades; only impacted phantasm blades are sacrificed.')
        if (!bridge.contains('TreasureRules.useOneDurability(') || !bridge.contains('TreasuryBladeRules.vanishesOnBreak(')
                || !bridge.contains('getMethod("isDestructable")') || !effects.contains('usesDurability(unbreaking, roll)'))
            throw new GradleException('Durability must respect unbreaking, native destructability and ordinary broken blades.')
        if (!entity.contains('SlashBladeTreasuryCompat.damageAgainst(') || !bridge.contains('EnchantmentHelper.modifyDamage(')
                || !bridge.contains('getBaseAttackModifier') || !bridge.contains('mods.flammpfeil.slashblade.item.SwordType'))
            throw new GradleException('Damage must derive from the fired blade, enchantments and grade.')
        if (entity.contains('TreasureRules.DAMAGE') || entity.contains('1 - distance / radius')
                || !upgrades.contains('event.getSource().is(KingsTreasure.DAMAGE_TYPE)'))
            throw new GradleException('Do not reintroduce fixed damage, falloff or held-weapon upgrades.')
        if (!entity.contains('RoyalBladeEffects.ignite(level, firedBlade, target)')
                || !effects.contains('Enchantments.FIRE_ASPECT') || !effects.contains('Enchantments.UNBREAKING')
                || !effects.contains('DataComponents.CUSTOM_MODEL_DATA'))
            throw new GradleException('Fire aspect, unbreaking and red-key mode must be connected.')
        if (ja['item.venusmod.king_treasury'] != '王の宝物庫' || !en.containsKey('item.venusmod.king_treasury'))
            throw new GradleException('Treasury translations must remain.')
        println 'Verified royal blade interaction contracts.'
    }
}
tasks.named('check') { dependsOn 'verifyKingsTreasureInteractionContracts' }

def assets = layout.buildDirectory.dir('generated/kingsTreasureAssets')
tasks.register('generateKingsTreasureAssets', JavaExec) {
    dependsOn 'compileVenusAssetGenerator'
    classpath tasks.named('compileVenusAssetGenerator').flatMap { it.destinationDirectory }
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    mainClass = 'KingsTreasureAssets'
    systemProperty 'java.awt.headless', 'true'
    args assets.get().asFile.absolutePath
    inputs.file('tools/java/KingsTreasureAssets.java')
    outputs.dir assets
}
sourceSets.main.resources.srcDir assets
tasks.named('processResources') { dependsOn 'generateKingsTreasureAssets' }

tasks.register('verifyTreasurySelectionWiring') {
    group = 'verification'
    notCompatibleWithConfigurationCache('Validation inspects project source files')
    doLast {
        def root = 'src/main/java/dev/ssscfw/venusmod/'
        def saved = file(root + 'treasury/KingsTreasurySavedData.java').text
        def protection = file(root + 'treasury/TreasuryBladeProtection.java').text
        def menu = file(root + 'treasury/KingsTreasuryMenu.java').text
        def screen = file(root + 'client/KingsTreasuryScreen.java').text
        def treasure = file(root + 'treasure/KingsTreasure.java').text
        def entity = file(root + 'treasure/RoyalBladeEntity.java').text
        def forge = file(root + 'compat/create/client/VenusBladeForgeScreen.java').text
        def forgeMenu = file(root + 'compat/create/VenusBladeForgeMenu.java').text
        if (!saved.contains('TreasuryBladeProtection.migrate(stack, entryTag.getBoolean("Favorite"), entryTag.getBoolean("PhantasmProtected"))')
                || !saved.contains('TreasuryBladeProtection.cycle(entry.template)')
                || !protection.contains('DataComponents.CUSTOM_DATA') || !protection.contains('venusmod_treasury_protection'))
            throw new GradleException('Protection must live on the blade and migrate legacy entry flags.')
        if (!saved.contains('"VolleyLimit"') || !saved.contains('"VolleyPriority"')
                || !saved.contains('RoyalBladeEffectsRules.eligible(entry.protection(),')
                || !saved.contains('TreasuryVolleyRules.select(') || !saved.contains('VolleyPriority.RANK_LOW'))
            throw new GradleException('Saved limits, mode protection and low-rank whole-treasury selection must remain.')
        if (!menu.contains('clickType == ClickType.PICKUP && button == 1') || !menu.contains('storage.cycleProtection(')
                || !menu.contains('DATA_FAVORITES_START') || !menu.contains('storage.setVolleyPriority('))
            throw new GradleException('GUI protection and priority controls must reach the server.')
        if (!screen.contains('menu.isFavorite(index)') || !screen.contains('menu.isPhantasmProtected(index)')
                || !screen.contains('0xFF205B2D') || !screen.contains('0xFF662020') || !screen.contains('BUTTON_PRIORITY_START'))
            throw new GradleException('GUI must show green/red protection and left priority buttons.')
        if (!entity.contains('TreasureRules.formationOffset(formationSlot, formationSize)')
                || !treasure.contains('blade.stage(player, template, slot, aimDirection, selected.size(), phantasm)'))
            throw new GradleException('Partial formations must use actual blade count.')
        if (!entity.contains('SoundSource.PLAYERS, TreasureRules.EXPLOSION_VOLUME'))
            throw new GradleException('Impact sound must use the shared volume.')
        if (!forge.contains('ForgeScreenLayout.nameWidth(countWidth)') || !forge.contains('font.plainSubstrByWidth')
                || !forgeMenu.contains('ForgeScreenLayout.INVENTORY_Y'))
            throw new GradleException('Forge text and menu layout must stay coordinated.')
        println 'Verified persistent protection, selection and GUI wiring.'
    }
}
tasks.named('check') { dependsOn 'verifyTreasurySelectionWiring' }
