// 過去にyaw/pitch変換だけで刀身方向を合わせようとして90度ずれが再発したため、
// 実方向Vector3fを同期し、OBJの-X軸から直接rotationToする契約を固定する。
tasks.register('verifyKingsTreasureRenderDirection') {
    group = 'verification'
    description = 'Verify royal blade rendering uses the synced direction vector directly.'
    notCompatibleWithConfigurationCache('Validation inspects project source files')
    doLast {
        def entity = file('src/main/java/dev/ssscfw/venusmod/treasure/RoyalBladeEntity.java').text
        def renderer = file('src/main/java/dev/ssscfw/venusmod/client/RoyalBladeRenderer.java').text

        if (!entity.contains('EntityDataSerializers.VECTOR3'))
            throw new GradleException('RoyalBladeEntity must sync the real aim direction with VECTOR3.')
        if (!entity.contains('public Vec3 aimDirection()'))
            throw new GradleException('RoyalBladeEntity must expose the synced aim direction.')
        if (!entity.contains('setAimDirection(direction);'))
            throw new GradleException('RoyalBladeEntity must update synced aim direction on stage/launch.')
        if (!renderer.contains('blade.aimDirection()'))
            throw new GradleException('RoyalBladeRenderer must consume the synced direction vector.')
        if (!(renderer =~ /rotationTo\s*\(\s*MODEL_TIP\s*,\s*target\s*\)/))
            throw new GradleException('RoyalBladeRenderer must rotate the OBJ tip axis directly to the target direction.')
        if (renderer.contains('blade.getYRot()') || renderer.contains('blade.getXRot()'))
            throw new GradleException('RoyalBladeRenderer must not reconstruct rendering direction from yaw/pitch.')
        if (!renderer.contains('Axis.XP.rotationDegrees(age * 1.5F)'))
            throw new GradleException('Royal blade rings must rotate around the blade axis.')
        if (!(renderer =~ /addVertex\s*\(\s*matrix\s*,\s*-0\.15F\s*,/))
            throw new GradleException('Royal blade rings must be drawn in the YZ plane, perpendicular to the blade axis.')

        println "Verified King's Treasure direct-vector render direction contract."
    }
}
tasks.named('check') { dependsOn 'verifyKingsTreasureRenderDirection' }

// /give限定回収・F切替・持ち替え維持・射出後返却・遠距離パーティクル・刀由来ダメージを固定する。
tasks.register('verifyKingsTreasureInteractionContracts') {
    group = 'verification'
    description = 'Verify treasury give-only capture, persistent preparation, blade returns, particles, blade-derived damage, F cycling, and no cooldown.'
    notCompatibleWithConfigurationCache('Validation inspects project source files')
    doLast {
        def treasure = file('src/main/java/dev/ssscfw/venusmod/treasure/KingsTreasure.java').text
        def entity = file('src/main/java/dev/ssscfw/venusmod/treasure/RoyalBladeEntity.java').text
        def durability = file('src/main/java/dev/ssscfw/venusmod/compat/SlashBladeTreasuryCompat.java').text
        def upgrades = file('src/main/java/dev/ssscfw/venusmod/event/BladeUpgradeEvents.java').text
        def client = file('src/main/java/dev/ssscfw/venusmod/client/KingsTreasureClient.java').text
        def events = file('src/main/java/dev/ssscfw/venusmod/event/KingsTreasuryEvents.java').text
        def mod = file('src/main/java/dev/ssscfw/venusmod/VenusMod.java').text
        def saved = file('src/main/java/dev/ssscfw/venusmod/treasury/KingsTreasurySavedData.java').text
        def ja = new groovy.json.JsonSlurper().parse(file('src/main/resources/assets/venusmod/lang/ja_jp.json'))
        def en = new groovy.json.JsonSlurper().parse(file('src/main/resources/assets/venusmod/lang/en_us.json'))

        if (treasure.contains('addCooldown(') || treasure.contains('isOnCooldown('))
            throw new GradleException("King's Treasure must not use item cooldowns.")
        if (!client.contains('keySwapOffhand.consumeClick()') || !client.contains('LimitAction'))
            throw new GradleException('F/swap-offhand key must cycle the volley limit while holding King\'s Treasure.')

        if (!events.contains('onCommand(CommandEvent') || !events.contains('PENDING_GIVES'))
            throw new GradleException('/give collection must be armed specifically by CommandEvent.')
        if (!events.contains('GiveCaptureRules.newlyAdded'))
            throw new GradleException('/give collection must compare inventory counts before and after the command.')
        int tickStart = events.indexOf('public static void onPlayerTick(PlayerTickEvent.Post')
        int tickEnd = events.indexOf('public static void onLogout', tickStart)
        if (tickStart < 0 || tickEnd < 0)
            throw new GradleException('KingsTreasuryEvents pending /give tick handler is missing.')
        def tickBody = events.substring(tickStart, tickEnd)
        if (!tickBody.contains('PENDING_GIVES.remove(player.getUUID())'))
            throw new GradleException('PlayerTick must only process a pending /give capture.')
        if (tickBody.contains('for (int slot = 0; slot < player.getInventory().getContainerSize(); slot++)'))
            throw new GradleException('PlayerTick must not scan and absorb the whole existing inventory.')
        if (!events.contains('storage.autoCollect(player.getUUID())'))
            throw new GradleException('/give capture must still require treasury auto-collect ON.')
        if (!mod.contains('KingsTreasuryEvents::onCommand') || !mod.contains('KingsTreasuryEvents::onPlayerTick'))
            throw new GradleException('KingsTreasuryEvents command/tick handlers must be registered.')

        if (!treasure.contains('TreasureRules.keepPrepared('))
            throw new GradleException('Prepared blades must use the held-item-independent lifecycle rule.')
        int formationTick = treasure.indexOf('private static void tick(PlayerTickEvent.Post')
        int cancelMethod = treasure.indexOf('private static void cancel(UUID owner)', formationTick)
        if (formationTick < 0 || cancelMethod < 0)
            throw new GradleException('King\'s Treasure formation tick handler is missing.')
        def formationTickBody = treasure.substring(formationTick, cancelMethod)
        if (formationTickBody.contains('!isHeld(player)'))
            throw new GradleException('Switching away from King\'s Treasure must not cancel prepared blades.')

        if (!treasure.contains('.clientTrackingRange(32)'))
            throw new GradleException('Royal blade tracking range must remain extended for distant visuals.')
        if (!entity.contains('sendParticles(viewer, particle, true'))
            throw new GradleException('Royal blade particles must use forced long-distance packets.')
        if (!entity.contains('FAR_PARTICLE_RANGE_SQR'))
            throw new GradleException('Royal blade particles must keep an explicit far visibility range.')

        if (!entity.contains('finishFlight(owner)') || !entity.contains('KingsTreasure.returnSpentBlade(player, blade())'))
            throw new GradleException('Every normal fired-blade completion path must return the blade.')
        if (!treasure.contains('SlashBladeTreasuryCompat.damageOnePoint(original)'))
            throw new GradleException('Returned blades must lose exactly one durability use.')
        if (!durability.contains('TreasureRules.useOneDurability(')
                || !durability.contains('setBrokenMethod.invoke(state, use.broken())'))
            throw new GradleException('SlashBlade return bridge must preserve broken blades instead of deleting them.')
        if (!treasure.contains('storage.insert(player.getUUID(), returned, 1)'))
            throw new GradleException('Spent blades must be reinserted into the owner UUID treasury.')

        if (!entity.contains('SlashBladeTreasuryCompat.damageAgainst(')
                || !durability.contains('EnchantmentHelper.modifyDamage(')
                || !durability.contains('getBaseAttackModifier')
                || !durability.contains('mods.flammpfeil.slashblade.item.SwordType'))
            throw new GradleException('Royal blade damage must come from the fired blade base attack, enchantments, and SwordType.')
        if (entity.contains('TreasureRules.DAMAGE') || entity.contains('1 - distance / radius'))
            throw new GradleException('Royal blade damage must not fall back to the old fixed/falloff formula.')
        if (!upgrades.contains('event.getSource().is(KingsTreasure.DAMAGE_TYPE)'))
            throw new GradleException('Held-blade Venus upgrades must not alter King\'s Treasure damage.')

        if (!saved.contains('"VolleyLimit"') || !saved.contains('cycleVolleyLimit'))
            throw new GradleException('Volley limit must be persisted per player.')
        if (ja['item.venusmod.king_treasury'] != '王の宝物庫')
            throw new GradleException('Japanese King Treasury item translation is missing.')
        if (!en.containsKey('item.venusmod.king_treasury'))
            throw new GradleException('English King Treasury item translation is missing.')

        println "Verified King's Treasure interaction contracts."
    }
}
tasks.named('check') { dependsOn 'verifyKingsTreasureInteractionContracts' }

