name: Verify Venus regression tests
on:
  push:
    branches: [main, feature/venus-hostile-mobs]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: venus-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        create: ['false', 'true']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false
      - name: Build and model contracts
        run: gradle build --no-configuration-cache --stacktrace
      - name: Pure Java frame regression
        run: |
          mkdir -p build/standalone-tests
          javac -d build/standalone-tests src/main/java/dev/ssscfw/venusmod/world/PortalRectangle.java tests/PortalRectangleTest.java
          java -cp build/standalone-tests PortalRectangleTest
          javac -d build/standalone-tests src/main/java/dev/ssscfw/venusmod/environment/ExposureRules.java src/main/java/dev/ssscfw/venusmod/compat/create/CondenserProcess.java tests/Phase2RulesTest.java
          java -cp build/standalone-tests Phase2RulesTest
          javac -d build/standalone-tests src/main/java/dev/ssscfw/venusmod/upgrade/BladeUpgradeRules.java tests/BladeUpgradeRulesTest.java
          java -cp build/standalone-tests BladeUpgradeRulesTest
      - name: Resource and generated structure regression
        run: python3 tools/validate_venus_resources.py
      - name: Minecraft codec and neighbour-face GameTests
        run: |
          mkdir -p run/gameTestServer
          printf 'eula=true\n' > run/gameTestServer/eula.txt
          gradle runGameTestServer -PvenusTestCreate=${{ matrix.create }} --no-configuration-cache --stacktrace
      - name: Dedicated Venus dimension generation
        run: |
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          printf 'online-mode=false\nview-distance=2\nsimulation-distance=2\n' > run/server/server.properties
          timeout 180s gradle runServer -PvenusWorldgenSmoke=true -PvenusTestCreate=${{ matrix.create }} --no-configuration-cache --stacktrace | tee venus-worldgen-smoke.log
          grep -q VENUS_WORLDGEN_SMOKE_PASSED venus-worldgen-smoke.log
      - name: Upload test logs and build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venus-verification-create-${{ matrix.create }}
          path: |
            build/libs/*.jar
            build/reports/
            run/gameTestServer/logs/
            run/server/logs/
            venus-worldgen-smoke.log
      - name: Upload source snapshot for reproduction
        if: always() && matrix.create == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: venus-source-snapshot
          path: |
            src/
            tools/
            tests/
            docs/
            gradle/
            build.gradle
            settings.gradle
            gradle.properties
            AGENTS.md
