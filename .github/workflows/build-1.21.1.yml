name: Build 1.21.1 NeoForge

on:
  push:
    branches:
      - main
      - feature/venus-hostile-mobs
  workflow_dispatch:
    inputs:
      server_smoke_test:
        description: Run dedicated server smoke test
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false
          cache-cleanup: on-success

      - name: Build
        run: gradle build --build-cache --stacktrace

      - name: Dedicated server smoke test
        if: ${{ inputs.server_smoke_test }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          log="$GITHUB_WORKSPACE/server-smoke.log"
          : > "$log"

          setsid gradle runServer --build-cache --stacktrace > "$log" 2>&1 &
          server_pid=$!

          cleanup() {
            kill -- -"$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 90); do
            if grep -q "Done (" "$log"; then
              cat "$log"
              echo "Dedicated server reached the ready state."
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log"
              echo "Dedicated server exited before reaching the ready state."
              exit 1
            fi
            sleep 1
          done

          cat "$log"
          echo "Dedicated server did not reach the ready state within 90 seconds."
          exit 1

      - name: Verify machine tooltips in JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile

          jars = sorted(
              p for p in pathlib.Path("build/libs").glob("*.jar")
              if not p.name.endswith(("-sources.jar", "-javadoc.jar"))
          )
          assert jars, "Built JAR was not found"
          machine_ids = (
              "diamond_hopper",
              "atmospheric_condenser",
              "metal_separator",
              "blade_repair_station",
              "blade_breaker",
              "venus_blade_forge",
          )
          with zipfile.ZipFile(jars[0]) as jar:
              required_classes = (
                  "dev/ssscfw/venusmod/item/MachineDescriptionItem.class",
                  "dev/ssscfw/venusmod/client/MachineTooltipEvents.class",
                  "dev/ssscfw/venusmod/item/PortableLifeSupportItem.class",
                  "dev/ssscfw/venusmod/item/PressureArmorItem.class",
              )
              for path in required_classes:
                  assert path in jar.namelist(), f"Missing class in JAR: {path}"
              for locale in ("ja_jp", "en_us"):
                  path = f"assets/venusmod/lang/{locale}.json"
                  strings = json.loads(jar.read(path))
                  for machine_id in machine_ids:
                      for field in ("description", "usage"):
                          key = f"tooltip.venusmod.machine.{machine_id}.{field}"
                          assert strings.get(key), f"Missing {locale} tooltip key: {key}"
                  equipment_ids = (
                      "portable_life_support",
                      "pressure_helmet",
                      "pressure_chestplate",
                      "pressure_leggings",
                      "pressure_boots",
                  )
                  for equipment_id in equipment_ids:
                      fields = ("description", "usage", "details") if equipment_id == "portable_life_support" else ("description", "usage")
                      for field in fields:
                          key = f"tooltip.venusmod.equipment.{equipment_id}.{field}"
                          assert strings.get(key), f"Missing {locale} tooltip key: {key}"
          print("Verified machine and equipment tooltip classes and both locale translations in built JAR.")
          PY

      - name: Prepare direct JAR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          if [ -z "$jar_path" ]; then
            echo "Built JAR was not found."
            exit 1
          fi
          cp "$jar_path" VenusMod-1.21.1.jar

      - name: Publish direct JAR download
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(printf 'Branch: `%s`\nCommit: `%s`\nRun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"

          if gh release view ci-latest >/dev/null 2>&1; then
            gh release edit ci-latest \
              --target "$GITHUB_SHA" \
              --title "Latest CI build" \
              --notes "$notes" \
              --prerelease \
              --latest=false
            gh release upload ci-latest VenusMod-1.21.1.jar --clobber
          else
            gh release create ci-latest VenusMod-1.21.1.jar \
              --target "$GITHUB_SHA" \
              --title "Latest CI build" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi

          direct_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/ci-latest/VenusMod-1.21.1.jar"
          echo "### Direct JAR download" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download VenusMod-1.21.1.jar]($direct_url)" >> "$GITHUB_STEP_SUMMARY"
