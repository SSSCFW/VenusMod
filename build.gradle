plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
            exclude '**/.cache/**'
        }
    }
}

repositories {
    // Optional Create integration compile dependencies.
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven' }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'info'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Compile against Create without forcing it into VenusMod's runtime classpath.
    // Create's official 1.21.1 setup uses the slim jar with dependencies supplied separately.
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

// オリジナルPNG/NBTをJavaだけで生成。Pythonや手作業のアセット配置は不要。
def generatedVenusAssets = layout.buildDirectory.dir('generated/venusAssets')
def compileVenusAssetGenerator = tasks.register('compileVenusAssetGenerator', JavaCompile) {
    source = fileTree('tools/java') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/venusAssetGenerator')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.release = 21
}
def generateVenusAssets = tasks.register('generateVenusAssets', JavaExec) {
    dependsOn compileVenusAssetGenerator
    classpath(compileVenusAssetGenerator.flatMap { it.destinationDirectory })
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    mainClass = 'VenusAssetGenerator'
    systemProperty 'java.awt.headless', 'true'
    args generatedVenusAssets.get().asFile.absolutePath
    inputs.files(fileTree('tools/java') { include '**/*.java' })
    outputs.dir generatedVenusAssets
}
sourceSets.main.resources.srcDir generatedVenusAssets
tasks.named('processResources') { dependsOn generateVenusAssets }

apply from: 'gradle/venus-verification.gradle'
apply from: 'gradle/treasury-verification.gradle'
