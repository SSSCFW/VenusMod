modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SSSCFW/VenusMod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/SSSCFW/VenusMod"
authors="SSSCFW"
description='''
VenusMod for Minecraft 1.21.1 NeoForge.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Optional integration, but when Create is present this feature targets Create 6.0.10 only.
[[dependencies.${mod_id}]]
modId="create"
type="optional"
versionRange="[6.0.10,6.0.11)"
ordering="AFTER"
side="BOTH"
